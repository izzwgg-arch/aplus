function clean(h){const d=docOf(h);d.querySelectorAll('span').forEach(s=>{const p=s.parentNode;while(s.firstChild)p.insertBefore(s.firstChild,s);s.remove()});d.querySelectorAll('*').forEach(e=>{e.removeAttribute('style');e.removeAttribute('class');e.removeAttribute('id')});d.querySelectorAll('h2,h3,h4').forEach(x=>{const t=norm(x.textContent);if(t.length>90||/^[o•·\-]/i.test(t)){const p=d.createElement('p');p.innerHTML=x.innerHTML;x.replaceWith(p)}});const w=d.createTreeWalker(d.querySelector('main'),NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())n.nodeValue=inline(n.nodeValue);return d.querySelector('main').innerHTML||'<p><em>(empty)</em></p>'}

const header=(page,label)=>`<header class="header"><img src="public/letterhead/smart-steps-logo-cover.png"><div class="rt">ABA Assessment Report</div></header><div class="inner"><div class="sec-head"><span class="num">${page-1}</span><h2>${esc(label)}</h2></div><div class="sec-rule"></div>`;const footer=(p,total)=>`</div><footer class="footer"><div>Confidential</div><div>SmartSteps ABA</div><div class="pg">Page ${p} of ${total}</div></footer>`;
